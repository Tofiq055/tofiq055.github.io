baseURL = "https://tofiq055.github.io/"
title = "TOFIG VALIYEV"
theme = "PaperMod"
languageCode = "tr-TR"
defaultContentLanguage = "en"

[languages]
  [languages.en]
    languageName = "Türkçe"
    weight = 1

[pagination]
  pagerSize = 10

# Enable useful features
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

# Minify output
[minify]
  disableXML = true
  minifyOutput = true

# =============================================================================
# MENU
# =============================================================================

[[menu.main]]
  name = "Ana Sayfa"
  url = "/"
  weight = 1
[[menu.main]]
  name = "Yazılar"
  url = "/posts/"
  weight = 2
[[menu.main]]
  name = "Kategoriler"
  url = "/categories/"
  weight = 3
[[menu.main]]
  name = "Etiketler"
  url = "/tags/"
  weight = 4
[[menu.main]]
  name = "Arama"
  url = "/search/"
  weight = 5
[[menu.main]]
  name = "Hakkımda"
  url = "/about/"
  weight = 6

# =============================================================================
# PARAMS (Theme Settings)
# =============================================================================

[params]
  env = "production"
  author = "Tofig Valiyev"
  description = "Computer Eng. Student & System Enthusiast"
  
  # Date format (Turkish style)
  DateFormat = "2 January 2006"
  
  # Default theme: auto (follows system), dark, light
  defaultTheme = "auto"
  
  # Disable theme toggle button (false = enable)
  disableThemeToggle = false
  
  # Show reading time
  ShowReadingTime = true
  
  # Show share buttons
  ShowShareButtons = true
  
  # Show post navigation (prev/next)
  ShowPostNavLinks = true
  
  # Show breadcrumbs
  ShowBreadCrumbs = true
  
  # Show code copy button
  ShowCodeCopyButtons = true
  
  # Show RSS button
  ShowRssButtonInSectionTermList = true
  
  # Show Table of Contents
  ShowToc = true
  TocOpen = false
  
  # Show word count
  ShowWordCount = true
  
  # Comments (disabled by default)
  comments = false
  
  # Cloudflare Web Analytics (add your token when ready)
  # cloudflareAnalyticsToken = "YOUR_TOKEN_HERE"

  # Home info mode
  [params.homeInfoParams]
    Title = "Merhaba, ben Tofig!"
    Content = """
Bu blogda teknoloji gündemi, kişisel düşünceler ve teknik konular gibi birçok alanda yazılar yazmayı düşünüyorum.
Beni bu hesaplardan takip edebilirsiniz.
"""

  # Social icons
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Tofiq055"
    
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/tofig-valiyev-259442170/"
    
  [[params.socialIcons]]
    name = "email"
    url = "mailto:tofiq62@gmail.com"

  # Search settings
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# =============================================================================
# OUTPUTS (RSS, Search JSON, Sitemap)
# =============================================================================

[outputs]
  home = ["HTML", "RSS", "JSON"]

# =============================================================================
# TAXONOMIES
# =============================================================================

[taxonomies]
  tag = "tags"
  category = "categories"

# =============================================================================
# MARKUP (Syntax Highlighting)
# =============================================================================

[markup]
  [markup.highlight]
    noClasses = false
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "dracula"
  
  [markup.goldmark.renderer]
    unsafe = true
