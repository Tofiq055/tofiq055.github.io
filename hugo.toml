baseURL = "https://tofiq055.github.io/"
title = "TOFIG VALIYEV"
theme = "PaperMod"
languageCode = "tr-TR"
defaultContentLanguage = "tr"

[pagination]
  pagerSize = 10

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

[minify]
  disableXML = true
  minifyOutput = true

# =============================================================================
# LANGUAGES
# =============================================================================

[languages]
  [languages.tr]
    languageName = "Türkçe"
    weight = 1
    title = "TOFIG VALIYEV"
    [languages.tr.params]
      description = "Bilgisayar Müh. Öğrencisi & Sistem Meraklısı"
      [languages.tr.params.homeInfoParams]
        Title = "Merhaba, ben Tofig!"
        Content = """
Bu blogda teknoloji gündemi, kişisel düşünceler ve teknik konular gibi birçok alanda yazılar yazmayı düşünüyorum.
Beni bu hesaplardan takip edebilirsiniz.
"""

    [[languages.tr.menu.main]]
      name = "Ana Sayfa"
      url = "/"
      weight = 1
    [[languages.tr.menu.main]]
      name = "Yazılar"
      url = "/posts/"
      weight = 2
    [[languages.tr.menu.main]]
      name = "Kategoriler"
      url = "/categories/"
      weight = 3
    [[languages.tr.menu.main]]
      name = "Etiketler"
      url = "/tags/"
      weight = 4
    [[languages.tr.menu.main]]
      name = "Arama"
      url = "/search/"
      weight = 5
    [[languages.tr.menu.main]]
      name = "Hakkımda"
      url = "/about/"
      weight = 6
# =============================================================================
# PARAMS (Theme Settings)
# =============================================================================

[params]
  env = "production"
  author = "Tofig Valiyev"
  # Clean up: Removed description and homeInfoParams from global params as they are now per-language
  
  DateFormat = "2 January 2006"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = true
  comments = false
  
  # Social icons (Global)
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Tofiq055"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/tofig-valiyev-259442170/"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:tofiq62@gmail.com"

  # Search settings
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# =============================================================================
# OUTPUTS
# =============================================================================

[outputs]
  home = ["HTML", "RSS", "JSON"]

# =============================================================================
# TAXONOMIES
# =============================================================================

[taxonomies]
  tag = "tags"
  category = "categories"

# =============================================================================
# MARKUP
# =============================================================================

[markup]
  [markup.highlight]
    noClasses = false
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "dracula"
  
  [markup.goldmark.renderer]
    unsafe = true
